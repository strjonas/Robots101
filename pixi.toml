[workspace]
name = "robots101"
version = "0.1.0"
description = "Native macOS ROS 2 mobile robot simulator with a local Gemma brain"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "3.12.*"
pip = "*"
git = "*"
cmake = "*"
make = "*"
colcon-common-extensions = "*"
numpy = "*"
opencv = "*"
pyyaml = "*"
pydantic = ">=2,<3"
requests = "*"
pytest = "*"
ros-jazzy-desktop-full = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-ros-gz-image = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"
ros-jazzy-nav2-msgs = "*"
ros-jazzy-slam-toolbox = "*"
ros-jazzy-turtlebot3 = "*"
ros-jazzy-turtlebot3-gazebo = "*"
ros-jazzy-turtlebot3-navigation2 = "*"
ros-jazzy-turtlebot3-simulations = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-image-transport = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[pypi-dependencies]
ultralytics = "*"
ollama = "*"

[tasks]
validate-env = "bash -lc 'source scripts/ros_env.sh && python --version && ros2 --version && ros2 pkg prefix turtlebot3_gazebo && ros2 pkg prefix nav2_bringup'"
build = "bash scripts/build_workspace.sh"
test = "bash -lc 'source scripts/ros_env.sh && PYTHONPATH=src/brain_nodes pytest -q src/brain_nodes/test'"
generate-house-map = "bash -lc 'source scripts/ros_env.sh && python scripts/generate_house_map.py'"
sim-house = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup sim_only.launch.py with_gui:=${ROBOTS101_WITH_GUI:-false}'"
mapping = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup mapping.launch.py with_gui:=${ROBOTS101_WITH_GUI:-false}'"
nav = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup nav_only.launch.py with_gui:=${ROBOTS101_WITH_GUI:-false} map_file:=${ROBOTS101_MAP_FILE:-${ROBOTS101_ROOT:-$PWD}/maps/turtlebot3_house.yaml}'"
brain = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup brain_only.launch.py'"
full-stack = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup full_stack.launch.py with_gui:=${ROBOTS101_WITH_GUI:-false} map_file:=${ROBOTS101_MAP_FILE:-${ROBOTS101_ROOT:-$PWD}/maps/turtlebot3_house.yaml}'"
teleop = "bash -lc 'source scripts/ros_env.sh && ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r cmd_vel:=/brain/cmd_vel_manual'"
submit-task = "bash -lc 'source scripts/ros_env.sh && ros2 run brain_nodes submit_task_cli'"
clear-task = "bash -lc 'source scripts/ros_env.sh && ros2 run brain_nodes clear_task_cli'"
estop = "bash -lc 'source scripts/ros_env.sh && ros2 run brain_nodes set_emergency_cli'"
record-waypoint = "bash -lc 'source scripts/ros_env.sh && ros2 run brain_nodes record_waypoint_cli'"
rosbag-full = "bash -lc 'source scripts/ros_env.sh && mkdir -p bags && ros2 bag record -o bags/full_stack_debug /cmd_vel /brain/cmd_vel_manual /brain/cmd_vel_nav /brain/cmd_vel_executor /brain/control_mode /brain/current_task /brain/planner_action /brain/executor_status /brain/observation_summary /brain/tracked_objects /scan /odom /tf /tf_static /camera/image_raw'"
