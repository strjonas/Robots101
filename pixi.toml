[workspace]
name = "robots101"
version = "0.1.0"
description = "Native macOS ROS 2 mobile robot simulator with a local Gemma brain"
channels = ["robostack-jazzy", "conda-forge"]
platforms = ["osx-arm64"]

[dependencies]
python = "3.12.*"
pip = "*"
git = "*"
cmake = "*"
make = "*"
colcon-common-extensions = "*"
numpy = "*"
opencv = "*"
pyyaml = "*"
pydantic = ">=2,<3"
requests = "*"
pytest = "*"
ros-jazzy-desktop-full = "*"
ros-jazzy-rmw-cyclonedds-cpp = "*"
ros-jazzy-ros-gz-sim = "*"
ros-jazzy-ros-gz-bridge = "*"
ros-jazzy-ros-gz-image = "*"
ros-jazzy-navigation2 = "*"
ros-jazzy-nav2-bringup = "*"
ros-jazzy-nav2-msgs = "*"
ros-jazzy-slam-toolbox = "*"
ros-jazzy-turtlebot3 = "*"
ros-jazzy-turtlebot3-gazebo = "*"
ros-jazzy-turtlebot3-navigation2 = "*"
ros-jazzy-turtlebot3-simulations = "*"
ros-jazzy-teleop-twist-keyboard = "*"
ros-jazzy-image-transport = "*"
ros-jazzy-cv-bridge = "*"
ros-jazzy-xacro = "*"
ros-jazzy-robot-state-publisher = "*"
ros-jazzy-joint-state-publisher = "*"
ros-jazzy-joint-state-publisher-gui = "*"

[pypi-dependencies]
ultralytics = "*"
ollama = "*"

[tasks]
# Setup
build = "bash scripts/build_workspace.sh"
test = "bash -lc 'source scripts/ros_env.sh && PYTHONPATH=src/brain_nodes pytest -q src/brain_nodes/test'"
validate-env = "bash -lc 'source scripts/ros_env.sh && python --version && echo ROS_DISTRO=$ROS_DISTRO && ros2 pkg prefix turtlebot3_gazebo && ros2 pkg prefix nav2_bringup && ros2 pkg prefix brain_bringup'"
generate-house-map = "bash -lc 'source scripts/ros_env.sh && python scripts/generate_house_map.py'"

# Run the robot (one of these, in its own terminal). ROBOTS101_WITH_GUI=false runs without the Gazebo window.
sim = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup sim_only.launch.py with_gui:=${ROBOTS101_WITH_GUI:-true}'"
mapping = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup mapping.launch.py with_gui:=${ROBOTS101_WITH_GUI:-true}'"
nav = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup nav_only.launch.py with_gui:=${ROBOTS101_WITH_GUI:-true} map_file:=${ROBOTS101_MAP_FILE:-${ROBOTS101_ROOT:-$PWD}/maps/turtlebot3_house.yaml}'"
brain = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup brain_only.launch.py planner_backend:=${ROBOTS101_PLANNER_BACKEND:-ollama} model_name:=${ROBOTS101_MODEL:-gemma4:e4b} ollama_url:=${ROBOTS101_OLLAMA_URL:-http://127.0.0.1:11434}'"
full-stack = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup full_stack.launch.py with_gui:=${ROBOTS101_WITH_GUI:-true} map_file:=${ROBOTS101_MAP_FILE:-${ROBOTS101_ROOT:-$PWD}/maps/turtlebot3_house.yaml} planner_backend:=${ROBOTS101_PLANNER_BACKEND:-ollama} model_name:=${ROBOTS101_MODEL:-gemma4:e4b} ollama_url:=${ROBOTS101_OLLAMA_URL:-http://127.0.0.1:11434}'"

# Look at what is going on
rviz = "bash -lc 'source scripts/ros_env.sh && ros2 launch brain_bringup rviz.launch.py'"
status = "bash -lc 'source scripts/ros_env.sh && ros2 run brain_nodes status_cli'"
graph = "bash -lc 'source scripts/ros_env.sh && ros2 run rqt_graph rqt_graph'"
ros = "bash -lc 'source scripts/ros_env.sh && ros2 \"$@\"' ros"

# Interact with it
teleop = "bash -lc 'source scripts/ros_env.sh && ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -r cmd_vel:=/brain/cmd_vel_manual'"
submit-task = "bash -lc 'source scripts/ros_env.sh && ros2 run brain_nodes submit_task_cli \"$@\"' submit-task"
clear-task = "bash -lc 'source scripts/ros_env.sh && ros2 run brain_nodes clear_task_cli \"$@\"' clear-task"
estop = "bash -lc 'source scripts/ros_env.sh && ros2 run brain_nodes set_emergency_cli \"$@\"' estop"
record-waypoint = "bash -lc 'source scripts/ros_env.sh && ros2 run brain_nodes record_waypoint_cli \"$@\"' record-waypoint"
save-map = "bash -lc 'source scripts/ros_env.sh && mkdir -p maps && ros2 run nav2_map_server map_saver_cli -f maps/my_house --ros-args -p save_map_timeout:=10.0'"
rosbag-full = "bash -lc 'source scripts/ros_env.sh && mkdir -p bags && ros2 bag record -o bags/full_stack_debug /cmd_vel /brain/cmd_vel_manual /brain/cmd_vel_nav /brain/cmd_vel_executor /brain/control_mode /brain/current_task /brain/planner_action /brain/executor_status /brain/observation_summary /brain/tracked_objects /scan /odom /tf /tf_static /camera/image_raw'"
